{# Layer extents (white = layer present), built by scripts/build-fz-climate-estimate.py.
   The only pattern left is "data unavailable", which is dotted today. Climate change extents are solid colours. #}
{% set imgBase = "/design-spec/fz-climate-change-layers-v3-10-0-0/images" %}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="pat-nodata" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#ffffff"/>
      <circle cx="3" cy="3" r="1.2" fill="#000000"/>
    </pattern>
    {% for name in ['fz2', 'fz3', 'fz2cc', 'fz3cc'] %}
    <mask id="m-{{ name }}" maskUnits="userSpaceOnUse" x="0" y="0" width="620" height="720"><image href="{{ imgBase }}/mask-{{ name }}.png" width="620" height="720"/></mask>
    {% endfor %}
  </defs>
</svg>
